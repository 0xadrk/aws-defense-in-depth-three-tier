AWSTemplateFormatVersion: '2010-09-09'
Description: 05 - Web tier ALB (TLS) and app tier Auto Scaling group (IMDSv2, KMS-encrypted EBS, permission-bounded role)

Parameters:
  ProjectName:
    Type: String
    Default: fortress3t
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for HTTPS. Leave empty only for a lab without a domain (HTTP forward, NOT production).
  InstanceType:
    Type: String
    Default: t3.micro
  MinSize:
    Type: Number
    Default: 2
  MaxSize:
    Type: Number
    Default: 4

Conditions:
  HasCert: !Not [ !Equals [ !Ref CertificateArn, '' ] ]

Resources:
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-app-role'
      PermissionsBoundary: { 'Fn::ImportValue': !Sub '${ProjectName}-BoundaryArn' }
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: 'sts:AssumeRole' }
      ManagedPolicyArns: [ !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore' ]
      Policies:
        - PolicyName: least-privilege-app-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ 'secretsmanager:GetSecretValue', 'secretsmanager:DescribeSecret' ]
                Resource: { 'Fn::ImportValue': !Sub '${ProjectName}-SecretArn' }
              - Effect: Allow
                Action: [ 'kms:Decrypt', 'kms:GenerateDataKey', 'kms:DescribeKey' ]
                Resource: { 'Fn::ImportValue': !Sub '${ProjectName}-DataKeyArn' }
              - Effect: Allow
                Action: [ 's3:GetObject', 's3:PutObject' ]
                Resource: !Join [ '', [ { 'Fn::ImportValue': !Sub '${ProjectName}-AppBucketArn' }, '/*' ] ]
              - Effect: Allow
                Action: 's3:ListBucket'
                Resource: { 'Fn::ImportValue': !Sub '${ProjectName}-AppBucketArn' }
              - Effect: Allow
                Action: [ 'ssm:GetParameter', 'ssm:GetParameters', 'ssm:GetParametersByPath' ]
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [ !Ref AppRole ] }

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ProjectName}-app'
      LaunchTemplateData:
        ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [ { 'Fn::ImportValue': !Sub '${ProjectName}-AppSgId' } ]
        MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1, HttpEndpoint: enabled }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              Encrypted: true
              KmsKeyId: { 'Fn::ImportValue': !Sub '${ProjectName}-DataKeyArn' }
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            dnf install -y nginx
            echo "<h1>${ProjectName} - app tier</h1>" > /usr/share/nginx/html/index.html
            systemctl enable --now nginx
        TagSpecifications:
          - ResourceType: instance
            Tags: [ { Key: Name, Value: !Sub '${ProjectName}-app' } ]

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      SecurityGroups: [ { 'Fn::ImportValue': !Sub '${ProjectName}-AlbSgId' } ]
      Subnets: !Split [ ',', { 'Fn::ImportValue': !Sub '${ProjectName}-PublicSubnetIds' } ]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: deletion_protection.enabled, Value: 'false' }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: { 'Fn::ImportValue': !Sub '${ProjectName}-VpcId' }
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCert
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [ { CertificateArn: !Ref CertificateArn } ]
      DefaultActions: [ { Type: forward, TargetGroupArn: !Ref TargetGroup } ]

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions: !If
        - HasCert
        - [ { Type: redirect, RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 } } ]
        - [ { Type: forward, TargetGroupArn: !Ref TargetGroup } ]

  Asg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref MinSize
      VPCZoneIdentifier: !Split [ ',', { 'Fn::ImportValue': !Sub '${ProjectName}-AppSubnetIds' } ]
      TargetGroupARNs: [ !Ref TargetGroup ]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber

Outputs:
  AlbArn:
    Value: !Ref Alb
    Export: { Name: !Sub '${ProjectName}-AlbArn' }
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
