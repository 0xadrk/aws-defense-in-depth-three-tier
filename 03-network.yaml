AWSTemplateFormatVersion: '2010-09-09'
Description: 03 - Three-tier VPC (public/web, private/app, isolated/data), security groups, NACLs, flow logs

Parameters:
  ProjectName:
    Type: String
    Default: fortress3t

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [ { Key: Name, Value: !Sub '${ProjectName}-vpc' } ]

  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }

  # ---- Subnets: web (public), app (private), data (isolated) in two AZs
  PublicA:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref Vpc, CidrBlock: 10.20.0.0/24, AvailabilityZone: !Select [0, !GetAZs ''], Tags: [ { Key: Name, Value: !Sub '${ProjectName}-web-a' } ] }
  PublicB:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref Vpc, CidrBlock: 10.20.1.0/24, AvailabilityZone: !Select [1, !GetAZs ''], Tags: [ { Key: Name, Value: !Sub '${ProjectName}-web-b' } ] }
  AppA:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref Vpc, CidrBlock: 10.20.10.0/24, AvailabilityZone: !Select [0, !GetAZs ''], Tags: [ { Key: Name, Value: !Sub '${ProjectName}-app-a' } ] }
  AppB:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref Vpc, CidrBlock: 10.20.11.0/24, AvailabilityZone: !Select [1, !GetAZs ''], Tags: [ { Key: Name, Value: !Sub '${ProjectName}-app-b' } ] }
  DataA:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref Vpc, CidrBlock: 10.20.20.0/24, AvailabilityZone: !Select [0, !GetAZs ''], Tags: [ { Key: Name, Value: !Sub '${ProjectName}-data-a' } ] }
  DataB:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref Vpc, CidrBlock: 10.20.21.0/24, AvailabilityZone: !Select [1, !GetAZs ''], Tags: [ { Key: Name, Value: !Sub '${ProjectName}-data-b' } ] }

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttach
    Properties: { Domain: vpc }
  Nat:
    Type: AWS::EC2::NatGateway
    Properties: { AllocationId: !GetAtt NatEip.AllocationId, SubnetId: !Ref PublicA }

  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  AppRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  AppRoute:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref AppRt, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref Nat }
  DataRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }   # no default route: the data tier has no internet path

  PublicARt: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref PublicA, RouteTableId: !Ref PublicRt } }
  PublicBRt: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref PublicB, RouteTableId: !Ref PublicRt } }
  AppARt: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref AppA, RouteTableId: !Ref AppRt } }
  AppBRt: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref AppB, RouteTableId: !Ref AppRt } }
  DataARt: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref DataA, RouteTableId: !Ref DataRt } }
  DataBRt: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref DataB, RouteTableId: !Ref DataRt } }

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds: [ !Ref AppRt ]

  # ---- NACL on data subnets: only MySQL from the app subnets
  DataNacl:
    Type: AWS::EC2::NetworkAcl
    Properties: { VpcId: !Ref Vpc }
  DataNaclIn:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref DataNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.20.10.0/23, PortRange: { From: 3306, To: 3306 } }
  DataNaclOut:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref DataNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.20.10.0/23, PortRange: { From: 1024, To: 65535 } }
  DataANacl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref DataA, NetworkAclId: !Ref DataNacl }
  DataBNacl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref DataB, NetworkAclId: !Ref DataNacl }

  # ---- Security groups (tier-to-tier references, no wide-open rules except the ALB listener)
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web tier - ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 10.20.0.0/16 }

  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App tier - EC2 instances
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AlbSg }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  RotationSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Secrets Manager rotation Lambda
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Data tier - RDS
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 127.0.0.1/32 }   # effectively no egress

  QuarantineSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Quarantine - no inbound, no outbound (used by incident response)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 127.0.0.1/32 }

  DbFromApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref DbSg, IpProtocol: tcp, FromPort: 3306, ToPort: 3306, SourceSecurityGroupId: !Ref AppSg }
  DbFromRotation:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref DbSg, IpProtocol: tcp, FromPort: 3306, ToPort: 3306, SourceSecurityGroupId: !Ref RotationSg }
  AppToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref AppSg, IpProtocol: tcp, FromPort: 3306, ToPort: 3306, DestinationSecurityGroupId: !Ref DbSg }
  RotationToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref RotationSg, IpProtocol: tcp, FromPort: 3306, ToPort: 3306, DestinationSecurityGroupId: !Ref DbSg }

  # ---- VPC flow logs, encrypted with the audit key
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/${ProjectName}/vpc-flow-logs'
      RetentionInDays: 90
      KmsKeyId: { 'Fn::ImportValue': !Sub '${ProjectName}-AuditKeyArn' }
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: vpc-flow-logs.amazonaws.com }, Action: 'sts:AssumeRole' }
      Policies:
        - PolicyName: write-flow-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ 'logs:CreateLogStream', 'logs:PutLogEvents', 'logs:DescribeLogStreams' ]
                Resource: !GetAtt FlowLogGroup.Arn
  FlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId: !Ref Vpc
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub '${ProjectName}-VpcId' }
  PublicSubnetIds:
    Value: !Join [ ',', [ !Ref PublicA, !Ref PublicB ] ]
    Export: { Name: !Sub '${ProjectName}-PublicSubnetIds' }
  AppSubnetIds:
    Value: !Join [ ',', [ !Ref AppA, !Ref AppB ] ]
    Export: { Name: !Sub '${ProjectName}-AppSubnetIds' }
  DataSubnetIds:
    Value: !Join [ ',', [ !Ref DataA, !Ref DataB ] ]
    Export: { Name: !Sub '${ProjectName}-DataSubnetIds' }
  AlbSgId:
    Value: !Ref AlbSg
    Export: { Name: !Sub '${ProjectName}-AlbSgId' }
  AppSgId:
    Value: !Ref AppSg
    Export: { Name: !Sub '${ProjectName}-AppSgId' }
  DbSgId:
    Value: !Ref DbSg
    Export: { Name: !Sub '${ProjectName}-DbSgId' }
  RotationSgId:
    Value: !Ref RotationSg
    Export: { Name: !Sub '${ProjectName}-RotationSgId' }
  QuarantineSgId:
    Value: !Ref QuarantineSg
    Export: { Name: !Sub '${ProjectName}-QuarantineSgId' }
