AWSTemplateFormatVersion: '2010-09-09'
Description: 01 - Customer-managed KMS keys (key policies + grant-based access) and IAM permission boundary

Parameters:
  ProjectName:
    Type: String
    Default: fortress3t

Resources:
  # Key for workload data: S3, RDS, EBS, SSM Parameter Store, Secrets Manager, SNS
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub '${ProjectName} data key (S3, RDS, EBS, SSM, Secrets Manager, SNS)'
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIamPolicies
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          - Sid: UseThroughAwsServicesInThisAccountOnly
            Effect: Allow
            Principal: { AWS: '*' }
            Action: [ 'kms:Encrypt', 'kms:Decrypt', 'kms:ReEncrypt*', 'kms:GenerateDataKey*', 'kms:DescribeKey' ]
            Resource: '*'
            Condition:
              StringEquals:
                'kms:CallerAccount': !Ref AWS::AccountId
                'kms:ViaService':
                  - !Sub 'ec2.${AWS::Region}.amazonaws.com'
                  - !Sub 'rds.${AWS::Region}.amazonaws.com'
                  - !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                  - !Sub 'ssm.${AWS::Region}.amazonaws.com'
                  - !Sub 's3.${AWS::Region}.amazonaws.com'
                  - !Sub 'sns.${AWS::Region}.amazonaws.com'
          - Sid: CloudWatchAlarmsPublishToEncryptedTopic
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: [ 'kms:Decrypt', 'kms:GenerateDataKey*' ]
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
          - Sid: GrantsOnlyForAwsResources
            Effect: Allow
            Principal: { AWS: '*' }
            Action: [ 'kms:CreateGrant', 'kms:ListGrants', 'kms:RevokeGrant' ]
            Resource: '*'
            Condition:
              StringEquals:
                'kms:CallerAccount': !Ref AWS::AccountId
              Bool:
                'kms:GrantIsForAWSResource': 'true'

  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-data'
      TargetKeyId: !Ref DataKey

  # Key for the audit trail: CloudTrail, Config, CloudWatch Logs (VPC flow logs)
  AuditKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub '${ProjectName} audit key (CloudTrail, Config, CloudWatch Logs)'
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIamPolicies
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          - Sid: CloudTrailEncrypt
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: [ 'kms:GenerateDataKey*', 'kms:DescribeKey' ]
            Resource: '*'
            Condition:
              StringLike:
                'kms:EncryptionContext:aws:cloudtrail:arn': !Sub 'arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*'
          - Sid: ConfigDelivery
            Effect: Allow
            Principal: { Service: config.amazonaws.com }
            Action: [ 'kms:GenerateDataKey*', 'kms:Decrypt' ]
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
          - Sid: CloudWatchLogs
            Effect: Allow
            Principal: { Service: !Sub 'logs.${AWS::Region}.amazonaws.com' }
            Action: [ 'kms:Encrypt*', 'kms:Decrypt*', 'kms:ReEncrypt*', 'kms:GenerateDataKey*', 'kms:Describe*' ]
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*'

  AuditKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-audit'
      TargetKeyId: !Ref AuditKey

  # Caps what the application role can ever do, even if someone attaches AdministratorAccess to it
  AppPermissionBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-app-boundary'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowedCeiling
            Effect: Allow
            Action:
              - 'ssm:*'
              - 'ssmmessages:*'
              - 'ec2messages:*'
              - 'secretsmanager:GetSecretValue'
              - 'secretsmanager:DescribeSecret'
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
              - 'kms:DescribeKey'
              - 's3:GetObject'
              - 's3:PutObject'
              - 's3:ListBucket'
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
              - 'cloudwatch:PutMetricData'
              - 'ec2:DescribeInstances'
              - 'ec2:DescribeTags'
            Resource: '*'
          - Sid: NeverAllowed
            Effect: Deny
            Action:
              - 'iam:*'
              - 'organizations:*'
              - 'account:*'
              - 'kms:ScheduleKeyDeletion'
              - 'kms:DisableKey'
              - 'kms:PutKeyPolicy'
              - 'cloudtrail:StopLogging'
              - 'cloudtrail:DeleteTrail'
              - 'cloudtrail:UpdateTrail'
              - 'guardduty:DeleteDetector'
              - 'guardduty:UpdateDetector'
              - 'config:StopConfigurationRecorder'
              - 'config:DeleteConfigurationRecorder'
              - 'securityhub:DisableSecurityHub'
              - 'securityhub:BatchDisableStandards'
            Resource: '*'

Outputs:
  DataKeyArn:
    Value: !GetAtt DataKey.Arn
    Export: { Name: !Sub '${ProjectName}-DataKeyArn' }
  AuditKeyArn:
    Value: !GetAtt AuditKey.Arn
    Export: { Name: !Sub '${ProjectName}-AuditKeyArn' }
  BoundaryArn:
    Value: !Ref AppPermissionBoundary
    Export: { Name: !Sub '${ProjectName}-BoundaryArn' }
